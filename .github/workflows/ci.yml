name: Prototype checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build ${{ matrix.platform }} --release --no-pub

  macos-lab:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: swift test
      - run: python3 tools/smoke_probe.py
      - name: Compile lab without installing the filter
        run: >-
          xcodebuild -project macos/VPNGuardLab.xcodeproj
          -scheme VPNGuardLab -configuration Debug
          -derivedDataPath build/lab CODE_SIGNING_ALLOWED=NO build
